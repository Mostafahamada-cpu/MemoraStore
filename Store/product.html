<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product - Memora</title>
  <link rel="icon" type="image/jpeg" href="images/logo.jpeg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap">
  <link rel="stylesheet" href="assets/css/premium.css">
  <script src="assets/js/i18n.js"></script>
  <style>
    .product-hero-image { border-radius: 16px; overflow: hidden; aspect-ratio: 4/3; background: white; box-shadow: var(--shadow-lg); }
    .product-hero-image img { width: 100%; height: 100%; object-fit: cover; }
    .product-hero-image .card-placeholder span { font-size: 120px; }
    .product-price-box { background: var(--bg-white); padding: 20px; border-radius: 12px; margin-bottom: 24px; }
    .product-price { font-size: 36px; font-weight: 700; color: var(--accent-gold); font-family: var(--font-display); }
    .product-cta { display: flex; gap: 12px; margin-bottom: 32px; flex-wrap: wrap; }
    .product-cta .btn { flex: 1; min-width: 160px; }
    .product-features { list-style: none; display: flex; flex-direction: column; gap: 12px; }
    .product-features li { display: flex; align-items: flex-start; gap: 12px; padding: 8px 0; font-size: 15px; }
    .product-features li::before { content: '✓'; color: var(--accent-gold); font-weight: 700; min-width: 20px; }
    .design-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 24px; }
    .included-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
    .included-item { display: flex; align-items: center; gap: 14px; padding: 16px; border: 1px solid var(--border-light); border-radius: 12px; background: var(--bg-white); }
    .included-item .icon { font-size: 28px; color: var(--accent-gold); display: inline-flex; }
    .addon-glyph { font-size: 18px; color: var(--accent-gold); display: inline-flex; }
    .included-item strong { display: block; }
    .included-item span { font-size: 13px; color: var(--text-muted); }
    .included-item.is-exclusive { border-color: rgba(212, 107, 120, 0.4); background: rgba(212, 107, 120, 0.05); }
    .included-item.is-exclusive .icon { color: var(--accent-rose); }
    .addon-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
    .addon-tile { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border: 1px solid var(--border-light); border-radius: 12px; background: var(--bg-white); font-size: 14px; }
    .addon-tile .addon-name { display: flex; align-items: center; gap: 10px; font-weight: 600; }
    .perk { text-align: center; padding: 24px; }
    .perk .perk-icon { font-size: 34px; margin-bottom: 16px; color: var(--accent-gold); display: flex; justify-content: center; }
    .perk h4 { margin-bottom: 12px; }
    .perk p { font-size: 14px; }
    .not-found { padding: 80px 24px; text-align: center; }
  </style>
</head>
<body>
  <!-- Navigation -->
  <header class="navbar" id="navbar">
    <div class="container">
      <a class="nav-brand" href="index.html">
        <img src="images/logo.jpeg" alt="Memora" width="40" height="40">
        <span>Memora</span>
      </a>
      <nav class="nav-links" id="nav-links" aria-label="Main" data-i18n-aria="nav.main">
        <a href="index.html" data-i18n="nav.home">Home</a>
        <a href="index.html#wedding" data-i18n="nav.wedding">Wedding</a>
        <a href="index.html#moments" data-i18n="nav.occasions">Occasions</a>
        <a href="index.html#bundles" data-i18n="nav.bundles">Bundles</a>
        <a href="index.html#addons" data-i18n="nav.addons">Add-ons</a>
        <a href="index.html#faq" data-i18n="nav.faq">FAQ</a>
        <a href="order-form.html" class="btn btn-primary nav-menu-cta" data-i18n="nav.startOrder">Start Order</a>
      </nav>
      <div class="nav-right">
        <span class="lang-switch" data-lang-switch></span>
        <a href="order-form.html" class="btn btn-primary btn-sm nav-cta" data-i18n="nav.startOrder">Start Order</a>
        <button class="nav-toggle" id="nav-toggle" type="button" aria-label="Menu" data-i18n-aria="nav.menu" aria-controls="nav-links" aria-expanded="false">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
    </div>
  </header>

  <main id="product-root">
    <section class="section section-bg-light">
      <div class="container"><p class="catalog-loading" data-i18n="common.loading">Loading…</p></div>
    </section>
  </main>

  <script src="admin/assets/supabase-config.js"></script>
  <script src="assets/js/icons.js"></script>
  <script src="assets/js/catalog.js"></script>
  <script src="assets/js/premium.js"></script>
  <script>
    (() => {
      const slug = new URLSearchParams(window.location.search).get('id');
      const root = document.getElementById('product-root');
      let catalog = null;

      const esc = (v) => window.MemoraCatalog.escapeHtml(v);
      const t = (k, v) => window.MemoraI18n.t(k, v);
      const money = (n, o) => window.MemoraI18n.money(n, o);

      function notFound() {
        root.innerHTML = `<section class="section section-bg-light"><div class="container not-found"><h1>${esc(t('product.notFound'))}</h1><p style="margin: 16px 0 24px;">${esc(t('checkout.goBack'))}</p><a href="index.html" class="btn btn-primary">${esc(t('product.backHome'))}</a></div></section>`;
      }

      function badges(item) {
        const C = window.MemoraCatalog;
        const list = [];
        if (item.tier || item.kind === 'bundle' || item.type === 'custom') list.push(UI.tierBadge(item));
        if (item.badge === 'bestseller') list.push(`<span class="badge badge-rose">${esc(t('common.badge.bestseller'))}</span>`);
        if (item.badge === 'new') list.push(`<span class="badge badge-emerald">${esc(t('common.badge.new'))}</span>`);
        if (item.badge === 'best-value') list.push(`<span class="badge badge-gold">${esc(t('common.badge.bestValue'))}</span>`);
        return list.join('');
      }

      function designsSection(item) {
        if (!item.designs || !item.designs.length) return '';
        // Bundles list their items' designs: order the bundle, but show which product each design belongs to.
        const card = (d) => {
          const owner = item.kind === 'bundle' ? catalog.getProduct(d.product) : item;
          return owner ? UI.designCard(owner, d, owner.designs.length > 1, item) : '';
        };
        return `
          <section class="section section-bg-white">
            <div class="container">
              <h2 style="margin-bottom: 32px; text-align: center;">${esc(t('product.designsTitle'))}</h2>
              <div class="product-designs">
                ${item.designs.map(card).join('')}
              </div>
            </div>
          </section>`;
      }

      function includedSection(item) {
        if (item.kind !== 'bundle' || !item.items.length) return '';
        const C = window.MemoraCatalog;
        return `
          <section class="section section-bg-white">
            <div class="container">
              <h2 style="margin-bottom: 32px; text-align: center;">${esc(t('product.includedProducts'))}</h2>
              <div class="included-list">
                ${item.items.map((p) => `<a class="included-item${p.bundleOnly ? ' is-exclusive' : ''}" href="product.html?id=${encodeURIComponent(p.slug)}"><span class="icon">${UI.icon(UI.iconFor(p))}</span><div><strong>${esc(C.nameOf(p))}</strong><span>${p.bundleOnly ? `${esc(t('common.included'))} · ${esc(t('common.bundleExclusive'))}` : `${esc(money(p.price))} ${esc(t('common.individually'))}`}</span></div></a>`).join('')}
              </div>
            </div>
          </section>`;
      }

      // Bundle-only products (Love NFC Card): show where the card can be bought instead of add-ons.
      function availableInSection(item) {
        if (!item.bundleOnly) return '';
        const bundles = catalog.bundlesWith(item.slug);
        if (!bundles.length) return '';
        return `
          <section class="section section-bg-light" id="available-in">
            <div class="container">
              <h2 style="margin-bottom: 8px; text-align: center;">${esc(t('product.availableIn'))}</h2>
              <p style="text-align: center; margin-bottom: 32px;">${esc(t('product.bundleOnlyNote'))}</p>
              <div class="bundle-grid">${bundles.map((b, i) => UI.bundleCard(b, i)).join('')}</div>
            </div>
          </section>`;
      }

      function addonsSection(item) {
        if (item.type === 'custom' || item.bundleOnly || !catalog.addons.length) return '';
        const C = window.MemoraCatalog;
        const included = new Set(item.includedAddons || []);
        const value = (a) => {
          if (included.has(a.slug) || a.pricingType === 'free') return `<span class="price-pill free">${esc(included.has(a.slug) ? t('common.included') : t('common.free'))}</span>`;
          if (a.pricingType === 'from') return `<span class="price-pill from">${esc(t('common.from'))} ${esc(money(a.price, { plus: true }))}</span>`;
          return `<span class="price-pill">${esc(money(a.price, { plus: true }))}</span>`;
        };
        return `
          <section class="section section-bg-light">
            <div class="container">
              <h2 style="margin-bottom: 8px; text-align: center;">${esc(t('product.availableAddons'))}</h2>
              <p style="text-align: center; margin-bottom: 32px;">${esc(t('product.addonsNote'))}</p>
              <div class="addon-grid">
                ${catalog.addons.map((a) => `<div class="addon-tile"><span class="addon-name"><span class="addon-glyph">${UI.icon(UI.iconFor(a))}</span>${esc(C.nameOf(a))}</span>${value(a)}</div>`).join('')}
              </div>
            </div>
          </section>`;
      }

      function relatedSection(item) {
        // Same kind as the page (products suggest products, bundles suggest bundles), same category first.
        const isBundle = item.kind === 'bundle';
        const pool = catalog.sellable().filter((p) => p.slug !== item.slug && (p.kind === 'bundle') === isBundle);
        const sameCategory = pool.filter((p) => p.category === item.category);
        const related = [...sameCategory, ...pool.filter((p) => p.category !== item.category)].slice(0, isBundle ? 2 : 3);
        if (!related.length) return '';
        return `
          <section class="section section-bg-white">
            <div class="container">
              <h2 style="margin-bottom: 32px; text-align: center;">${esc(t('sections.relatedTitle'))}</h2>
              <div class="${isBundle ? 'bundle-grid' : 'shop-grid related-grid'}">
                ${related.map((p, i) => (isBundle ? UI.bundleCard(p, i) : UI.productCard(p, i))).join('')}
              </div>
            </div>
          </section>`;
      }

      let rendered = false;
      function render() {
        if (!catalog) return;
        const item = catalog.getItem(slug);
        if (!item) return notFound();
        const C = window.MemoraCatalog;
        const name = C.nameOf(item);
        const isCustom = item.type === 'custom';
        const bundleOnly = !!item.bundleOnly;
        // A bundle-only product can't be ordered alone: its CTA points at the bundles that include it.
        const orderHref = isCustom ? 'custom-order.html' : bundleOnly ? '#available-in' : `order-form.html?product=${encodeURIComponent(item.slug)}`;
        const orderLabel = isCustom ? t('common.requestQuote') : bundleOnly ? t('product.viewBundles') : t('common.orderNow');
        const features = C.featuresOf(item);
        document.title = `${name} - Memora`;

        root.innerHTML = `
          <section class="section section-bg-light">
            <div class="container">
              <div class="grid grid-2" style="align-items: center; gap: 40px;">
                <div class="product-hero-image">${C.imageMarkup(item, name)}</div>
                <div>
                  <div style="display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px;">${badges(item)}</div>
                  <h1 style="margin-bottom: 16px;">${esc(name)}</h1>
                  <p style="font-size: 18px; margin-bottom: 24px;">${esc(C.descOf(item))}</p>
                  <div class="product-price-box">
                    <div style="display: flex; align-items: baseline; gap: 12px; margin-bottom: 8px; flex-wrap: wrap;">
                      <span class="product-price">${esc(C.priceLabel(item))}</span>
                      ${item.kind === 'bundle' && item.compareTotal > item.price ? `<s style="color: var(--text-light);">${esc(money(item.compareTotal))}</s><span class="price-pill free">${esc(t('common.youSave'))} ${esc(money(item.savings))}</span>` : `<span style="font-size: 14px; color: var(--text-light);">${esc(isCustom || bundleOnly ? '' : t('product.oneTimePurchase'))}</span>`}
                    </div>
                    <p style="color: var(--text-secondary); font-size: 14px;">${esc(isCustom ? t('product.customPricingNote') : bundleOnly ? t('product.bundleOnlyNote') : t('product.perks'))}</p>
                  </div>
                  <div class="product-cta">
                    ${item.demo && item.designs.length < 2 ? `<a href="${esc(item.demo)}" target="_blank" rel="noopener noreferrer" class="btn btn-outline btn-lg">${esc(t('common.liveDemo'))}</a>` : ''}
                    <a href="${orderHref}" class="btn btn-primary btn-lg">${esc(orderLabel)}</a>
                    <button type="button" class="btn btn-secondary btn-lg" data-ask-whatsapp="${esc(item.name.en)}">${esc(t('common.askWhatsApp'))}</button>
                  </div>
                  ${features.length ? `<ul class="product-features">${features.map((f) => `<li>${esc(f)}</li>`).join('')}</ul>` : ''}
                </div>
              </div>
            </div>
          </section>

          ${designsSection(item)}
          ${includedSection(item)}

          <section class="section section-bg-white">
            <div class="container">
              <h2 style="margin-bottom: 32px; text-align: center;">${esc(t('product.includedTitle'))}</h2>
              <div class="grid grid-3">
                ${[['palette', 1], ['device', 2], ['background-animation', 3], ['our-story', 4], ['whatsapp', 5], ['infinity', 6]].map(([key, n]) => `<div class="perk"><div class="perk-icon">${UI.icon(key)}</div><h4>${esc(t(`product.perk${n}Title`))}</h4><p>${esc(t(`product.perk${n}Text`))}</p></div>`).join('')}
              </div>
            </div>
          </section>

          ${availableInSection(item)}
          ${addonsSection(item)}
          ${relatedSection(item)}

          <section class="section section-bg-light">
            <div class="container">
              <div style="text-align: center; background: white; padding: 64px 24px; border-radius: 24px;">
                <h2 style="margin-bottom: 16px;">${esc(t('product.readyTitle'))}</h2>
                <p style="font-size: 18px; color: var(--text-secondary); margin-bottom: 32px; max-width: 600px; margin-left: auto; margin-right: auto;">${esc(t('product.readySub'))}</p>
                <div style="display: flex; gap: 16px; justify-content: center; flex-wrap: wrap;">
                  <a href="${orderHref}" class="btn btn-primary btn-lg">${esc(orderLabel)}</a>
                  <a href="index.html" class="btn btn-secondary btn-lg">${esc(t('product.browseMore'))}</a>
                </div>
              </div>
            </div>
          </section>`;
        Animations.initScrollAnimations();
        if (!rendered) window.scrollTo({ top: 0 });
        rendered = true;
      }

      root.addEventListener('click', (event) => {
        const button = event.target.closest('[data-ask-whatsapp]');
        if (button) Store.buyNow(button.dataset.askWhatsapp);
      });

      document.addEventListener('DOMContentLoaded', async () => {
        try {
          catalog = await window.MemoraCatalog.load();
          render();
        } catch (error) {
          console.error('Memora catalog failed to load:', error);
          root.innerHTML = `<section class="section"><div class="container"><p class="empty-state">${esc(t('common.loadError'))}</p></div></section>`;
        }
      });
      window.MemoraI18n.onChange(render);
    })();
  </script>
</body>
</html>
