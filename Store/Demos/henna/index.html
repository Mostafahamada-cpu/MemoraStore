<body data-concept="shaabi">

    <!-- Concept switcher (demo): the three Egyptian henna concepts a customer can choose from -->
    <nav class="concept-switch" aria-label="Henna concept">
        <span class="concept-switch-label">Henna style</span>
        <button type="button" data-concept="shaabi" aria-pressed="true"><i class="sw sw-shaabi"></i>Shaabi</button>
        <button type="button" data-concept="saidi" aria-pressed="false"><i class="sw sw-saidi"></i>Sa'idi</button>
        <button type="button" data-concept="nubian" aria-pressed="false"><i class="sw sw-nubian"></i>Nubian</button>

                <span class="petal p4">✦</span>

                        <div class="letter-ar" lang="ar" dir="rtl">ليلة الحنة</div>
                        <div class="letter-text">Henna Night</div>
                    </div>
                </div>
            </div>

            <button id="open-btn">
                <span class="btn-icon">✉</span>
                <span class="btn-text">Open Invitation</span>
            </button>
        </div>
    </div>


    <main id="invitation" class="hidden">

                            <div class="countdown-number" id="days">00</div>
                        </div>
                        <div class="countdown-label">Days</div>
                    </div>
                    <div class="countdown-item">
                        <div class="countdown-card">
                            <div class="countdown-number" id="hours">00</div>
                        </div>
                        <div class="countdown-label">Hours</div>
                    </div>
                    <div class="countdown-item">
                        <div class="countdown-card">
                            <div class="countdown-number" id="minutes">00</div>
                        </div>
                        <div class="countdown-label">Minutes</div>
                    </div>
                    <div class="countdown-item">
                        <div class="countdown-card">
                            <div class="countdown-number" id="seconds">00</div>
                        </div>
                        <div class="countdown-label">Seconds</div>
                    </div>
                </div>
            </div>
        </section>

        <section id="location-section" class="section">
            <div class="section-wrapper">
                <h2 class="section-title">Location</h2>
                <div class="venue-line">
                    <span class="venue-name" id="venue-name"></span>
                    <span class="venue-address" id="venue-address"></span>
                </div>
                <div class="map-container">
                    <iframe id="google-map" title="Venue map" src="" frameborder="0" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
                </div>
                <div style="margin-top:18px; text-align:center;">
                    <a id="map-directions-link" class="map-link" href="" target="_blank" rel="noopener noreferrer">Get Directions</a>
                </div>
            </div>
        </section>

        <div class="concept-band" aria-hidden="true"></div>

        <div class="couple-monogram">
            <span id="groom-initial"></span>
            <span class="heart-icon" id="monogram-motif">✦</span>
            <span id="bride-initial"></span>
        </div>
        <div class="closing-footer" id="closing-line"></div>

        <footer id="footer">
            <p id="footer-text"></p>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
